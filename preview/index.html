<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>稳稳学英语 v0.2 两轮模式验证器</title>
<style>
  /* ===== 与 Android values/ 同源的色彩与尺寸（1:1 还原） ===== */
  :root {
    --bg-warm: #FFF6EA;
    --bg-card: #FFFFFF;
    --primary-green: #5BBFA0;
    --primary-green-dark: #3E9D80;
    --accent-coral: #FF8A65;
    --accent-yellow: #FFD166;
    --star-gold: #FFC107;
    --text-brown: #4E342E;
    --text-hint: #A1887F;
    --pastel0: #FF9E80; --pastel1: #80DEEA; --pastel2: #B39DDB; --pastel3: #AED581;
  }
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { background:#e8e2d9; font-family:"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; gap:14px; }

  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .toolbar button { padding:8px 18px; border:none; border-radius:20px; background:var(--primary-green); color:#fff; font-size:14px; cursor:pointer; }
  .toolbar button.off { background:#c9c2b8; }
  .toolbar .note { font-size:12px; color:#7a6f64; }
  .toolbar select { padding:9px 12px; border:none; border-radius:20px; background:var(--primary-green-dark); color:#fff; font-size:13px; cursor:pointer; outline:none; }

  .screens { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  .device { border-radius:34px; border:10px solid #3d3833; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.25); background:var(--bg-warm); }
  .device.phone { width:360px; height:740px; }
  /* 平板 = 横屏容器（2026-11-05 用户确认）：宽>高，独立一套布局见 #scrPad 专属样式 */
  .device.pad   { width:1024px; height:640px; }
  .screen { width:100%; height:100%; overflow:hidden; position:relative; display:flex; flex-direction:column; }

  /* ① 主题地图（内容超出时自身滚动） */
  .map { flex:1; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:32px 20px; }
  .map h1 { color:var(--primary-green-dark); font-size:36px; margin-top:40px; }
  .map .slogan { color:var(--text-hint); font-size:13px; margin-top:6px; }
  .theme-card { width:100%; background:var(--bg-card); border-radius:26px; box-shadow:0 4px 14px rgba(0,0,0,.08); margin-top:36px; padding:24px; text-align:center; cursor:pointer; transition:transform .15s; }
  .theme-card:active { transform:scale(.97); }
  .theme-card .name { color:var(--text-brown); font-size:22px; font-weight:700; }
  .theme-card .sub { color:var(--text-hint); font-size:12px; margin-top:8px; }
  /* 主题横幅卡：emoji + 左对齐双行 */
  .map .theme-card { margin-top:26px; cursor:pointer; background:linear-gradient(135deg,#FFF3E0,#FFE0B2); text-align:left; display:flex; align-items:center; gap:14px; padding:18px 20px; }
  .map .theme-card .t-emoji { flex:none; font-size:34px; }
  .map .theme-card .t-right { flex:1; min-width:0; }
  /* 关卡列表：彩徽章 + 双行左对齐文字 + 行尾箭头 */
  .level-row { width:100%; background:var(--bg-card); border-radius:20px; border:2px solid transparent; box-shadow:0 3px 10px rgba(0,0,0,.07); margin-top:12px; padding:13px 16px; cursor:pointer; display:flex; flex-direction:row; flex-wrap:nowrap; align-items:center; gap:14px; transition:transform .14s; }
  .level-row:active { transform:scale(.97); }
  .lv-badge { flex:none; width:46px; height:46px; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:#fff; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .lv-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; text-align:left; }
  .lv-name { color:var(--text-brown); font-size:15.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lv-desc { color:var(--text-hint); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lv-arrow { flex:none; color:var(--primary-green); font-size:22px; font-weight:900; line-height:1; padding-left:2px; }
  .level-row.all { background:linear-gradient(135deg,#E8F5EE,#DDF0E8); border:2px solid var(--primary-green); box-shadow:none; }
  .map .tip { color:var(--text-hint); font-size:11px; margin-top:18px; }
  /* 难度→主题选择页：顶部返回条 */
  .map-top { width:100%; display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .map-top .map-title { flex:1; text-align:center; color:var(--text-brown); font-size:16px; font-weight:800; }

  /* ② 听选会话：骨架锁定，任何卡片动画/内容变化都不得带动底部按钮 */
  .session { display:flex; flex-direction:column; height:100%; overflow:hidden; }
  .s-top { flex:none; display:flex; align-items:center; padding:22px 18px 6px; gap:8px; }
  .s-top .prog { flex:1; color:var(--text-brown); font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .s-top .stars { color:var(--star-gold); font-size:20px; font-weight:700; }
  .exit { width:38px; height:38px; flex:none; border:none; border-radius:50%; background:#fff; color:var(--text-brown); font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.14); }
  .exit:active { transform:scale(.9); }
  .chip { font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; color:#fff; }
  .chip.pic  { background:var(--accent-coral); }
  .chip.word { background:#4FA3D1; }
  .s-grid { flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; padding:14px 18px; }
  .s-row { flex:1; min-height:0; display:flex; gap:14px; }
  .opt { flex:1; min-width:0; min-height:0; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
         color:var(--text-brown); cursor:pointer; transition:transform .12s; background:#fff; outline:none; overflow:hidden; }
  .opt:active { transform:scale(.96); }
  /* 选项卡插画：图片优先回退 emoji（face-pic 内部可换材质） */
  .face-pic { font-size:72px; line-height:1.15; display:flex; align-items:center; justify-content:center; width:100%; height:100%; padding:10px; }
  .face-pic img { max-width:100%; max-height:100%; object-fit:contain; border-radius:18px; }
  /* 认词轮：卡片只有单词 */
  .face-word { font-size:34px; font-weight:800; letter-spacing:1px; }
  /* 答对后的"揭示"：看图轮→浮现单词；认词轮→浮现图片 */
  .reveal { font-weight:800; color:var(--text-brown); animation:revealIn .45s ease; }
  .opt.pic .reveal { font-size:28px; }
  .opt.word .reveal { font-size:44px; line-height:1.15; }
  @keyframes revealIn { from { opacity:0; transform:translateY(10px) scale(.7); } to { opacity:1; transform:none; } }
  /* 揭示后主面缩小，卡片内容永远不撑高外廓 */
  .face-pic, .face-word, .reveal { flex:none; }
  .opt.has-reveal .face-pic  { font-size:46px; transition:font-size .3s ease; }
  .opt.has-reveal .face-word { font-size:24px; transition:font-size .3s ease; }

  /* ③ 底部：固定高度零抖动；提示语在上，大居中按钮在下 */
  .s-bottom { flex:none; height:118px; padding:8px 18px 20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }

  /* 聆听跟读卡 */
  .listen-card { flex:none; margin:auto 0; background:linear-gradient(135deg,#fff,#FFF9F0); border-radius:26px; padding:30px 26px; display:flex; flex-direction:column; gap:12px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .listen-en { font-size:26px; font-weight:800; color:var(--text-brown); line-height:1.4; }
  .listen-zh { font-size:14px; color:var(--text-hint); }
  .listen-badge { align-self:flex-start; font-size:11px; color:#fff; background:var(--primary-green); padding:3px 12px; border-radius:10px; font-weight:700; }

  /* 单词题跟读按钮（答对揭示后出现在底部，与再听一次并排） */
  .s-bottom .row2 { display:flex; gap:12px; align-items:center; justify-content:center; width:100%; }
  .btn-rec-w { border:none; border-radius:28px; background:linear-gradient(150deg,#FF8A65,#FF7043); color:#fff; font-size:18px; font-weight:800;
               padding:15px 34px; cursor:pointer; box-shadow:0 5px 14px rgba(255,138,101,.45); display:inline-flex; align-items:center; gap:9px; }
  .btn-rec-w:active { transform:scale(.94); }
  .btn-rec-w.recording { background:linear-gradient(150deg,#EF5350,#E53935); animation:recPulse 1.1s ease-in-out infinite; }
  .rec-mini-result { font-size:13px; color:var(--text-brown); font-weight:800; min-height:18px; }
  .rec-mini-result .rec-stars { font-size:18px; display:inline; letter-spacing:1px; }
  /* ===== 跟读评测：麦克风按钮 + 波形 + 结果 ===== */
  .mic-btn { width:84px; height:84px; border-radius:50%; border:none; background:linear-gradient(150deg,#FF8A65,#FF7043); color:#fff; font-size:34px; cursor:pointer; box-shadow:0 6px 18px rgba(255,138,101,.45); transition:transform .15s; display:flex; align-items:center; justify-content:center; }
  .mic-btn:active { transform:scale(.92); }
  .mic-btn.recording { background:linear-gradient(150deg,#EF5350,#E53935); animation:recPulse 1.1s ease-in-out infinite; }
  @keyframes recPulse { 0%,100%{transform:scale(1); box-shadow:0 6px 18px rgba(239,83,80,.45)} 50%{transform:scale(1.06); box-shadow:0 6px 26px rgba(239,83,80,.65)} }
  .mic-tip { font-size:13px; color:var(--text-hint); }
  .rec-result { display:flex; flex-direction:column; align-items:center; gap:6px; min-height:64px; justify-content:center; }
  .rec-stars { font-size:30px; color:var(--star-gold); font-weight:900; letter-spacing:2px; animation:revealIn .45s ease; }
  .rec-score { font-size:13px; color:var(--text-hint); }
  .rec-err { font-size:12.5px; color:#E57373; text-align:center; line-height:1.5; }
  .rec-loading { font-size:13px; color:var(--primary-green-dark); animation:recPulse 1.1s ease-in-out infinite; }
  #scrPad .mic-btn { width:100px; height:100px; font-size:40px; }
  #scrPad .rec-stars { font-size:36px; }
  .s-bottom .hint { flex:none; width:100%; text-align:center; color:var(--text-brown); font-size:15px; font-weight:700; line-height:1.35; min-height:20px; }
  .replay { flex:none; border:none; border-radius:28px; background:var(--accent-yellow); color:var(--text-brown); font-size:18px; font-weight:800;
            padding:15px 46px; cursor:pointer; box-shadow:0 5px 14px rgba(255,209,102,.45); display:inline-flex; align-items:center; gap:9px; }
  .replay:active { transform:scale(.94); }

  /* ③ 结束页 */
  .done { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--text-brown); font-size:26px; font-weight:700; cursor:pointer; text-align:center; line-height:1.9; overflow:auto; }

  /* 退出确认浮层 */
  .exit-mask { position:absolute; inset:0; background:rgba(78,52,46,.38); display:flex; align-items:center; justify-content:center; z-index:30; }
  .exit-card { background:#fff; border-radius:26px; padding:28px 34px; text-align:center; box-shadow:0 14px 36px rgba(0,0,0,.22); animation:cardIn .34s cubic-bezier(.34,1.56,.64,1); }
  .exit-title { color:var(--text-brown); font-size:19px; font-weight:800; }
  .exit-stars { color:var(--text-hint); font-size:13px; margin-top:8px; }
  .exit-btns { display:flex; gap:12px; margin-top:20px; }
  .exit-btns button { border:none; border-radius:16px; padding:11px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  .exit-keep { background:var(--primary-green); color:#fff; }
  .exit-quit { background:var(--accent-coral); color:#fff; }

  /* 卡片入场：弹性缩放+错落登场 */
  @keyframes cardIn { from { opacity:0; transform:scale(.3) translateY(26px); } 62% { opacity:1; transform:scale(1.07) translateY(0); } 82% { transform:scale(.97); } to { opacity:1; transform:scale(1); } }
  /* 答对：欢庆弹跳 */
  @keyframes cheer { 0%{transform:scale(1)} 28%{transform:scale(1.13) rotate(-1.6deg)} 56%{transform:scale(1.08) rotate(1.4deg)} 80%{transform:scale(1.03)} 100%{transform:scale(1)} }
  /* 答错：轻柔摇摆（比原左右硬晃更软） */
  @keyframes wiggle { 0%{transform:translateX(0)} 24%{transform:translateX(-7px) rotate(-1deg)} 52%{transform:translateX(7px) rotate(1deg)} 78%{transform:translateX(-3px)} 100%{transform:translateX(0)} }
  .opt.anim-in    { animation:cardIn .5s cubic-bezier(.34,1.56,.64,1) backwards; }
  .opt.anim-cheer { animation:cheer .62s cubic-bezier(.34,1.56,.64,1); }
  .opt.anim-wrong { animation:wiggle .42s ease; }
  .answer-ring { outline:4px solid var(--primary-green); outline-offset:-4px; }
  .highlight-correct { outline:4px solid var(--star-gold); outline-offset:-4px; transform:scale(1.06); }

  .log { width:min(1050px,96vw); background:#3d3833; color:#9fe8c5; font-family:Consolas,monospace; font-size:12px; border-radius:10px; padding:10px 14px; max-height:150px; overflow:auto; line-height:1.7; }

  /* ===== u0 热身页：儿歌动画 + 指令词 ===== */
  .warm { flex:1; display:flex; flex-direction:column; align-items:center; padding:18px 18px 14px; overflow:auto; }
  .warm-top { flex:none; display:flex; align-items:center; gap:8px; width:100%; }
  .warm-title { flex:1; text-align:center; color:var(--text-brown); font-size:16px; font-weight:800; }
  .chant-card { flex:none; width:100%; margin-top:12px; background:linear-gradient(135deg,#FFF3E0,#FFE0B2); border-radius:24px; padding:18px 16px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .chant-emojis { display:flex; gap:8px; font-size:30px; }
  .chant-emojis span { display:inline-block; animation:chantBounce 1.2s ease-in-out infinite; }
  .chant-emojis span:nth-child(2) { animation-delay:.12s; }
  .chant-emojis span:nth-child(3) { animation-delay:.24s; }
  .chant-emojis span:nth-child(4) { animation-delay:.36s; }
  @keyframes chantBounce { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-9px) rotate(-4deg)} 60%{transform:translateY(3px)} }
  .chant-text { color:var(--text-brown); font-size:15px; font-weight:800; line-height:1.55; text-align:center; }
  .warm-words { flex:none; width:100%; margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .warm-word { background:var(--bg-card); border-radius:18px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
               opacity:0; transform:translateY(14px); animation:warmIn .45s ease forwards; }
  @keyframes warmIn { to { opacity:1; transform:translateY(0); } }
  .warm-word .w-icon { font-size:42px; line-height:1.1; }
  .warm-word .w-en { font-size:18px; font-weight:900; color:var(--text-brown); letter-spacing:.5px; }
  .warm-word .w-zh { font-size:11.5px; color:var(--text-hint); }
  .warm-word:active { transform:scale(.94); }
  .warm-word.played { outline:3px solid var(--primary-green); outline-offset:-3px; }
  .warm-go { flex:none; margin-top:16px; padding:14px 34px; border:none; border-radius:22px; background:var(--primary-green); color:#fff; font-size:17px; font-weight:800; cursor:pointer;
             box-shadow:0 5px 14px rgba(91,191,160,.4); }
  /* 平板横屏热身页 */
  #scrPad .warm { padding:16px 44px; }
  #scrPad .warm-title { font-size:18px; }
  #scrPad .chant-card { padding:22px; }
  #scrPad .chant-text { font-size:19px; }
  #scrPad .warm-words { grid-template-columns:repeat(4, 1fr); gap:16px; }
  #scrPad .warm-word .w-icon { font-size:56px; }
  #scrPad .warm-word .w-en { font-size:22px; }
  #scrPad .warm-go { margin-top:18px; font-size:19px; }

  /* ============================================================
     平板横屏专属布局（#scrPad 作用域，与手机版完全独立一套）
     ============================================================ */
  /* 会话页：横屏紧凑顶部 + 大卡片 */
  #scrPad .s-top { padding:12px 26px 4px; }
  #scrPad .s-grid { padding:16px 26px; gap:16px; }
  #scrPad .face-pic { font-size:84px; }
  #scrPad .face-word { font-size:42px; }
  #scrPad .opt.has-reveal .face-pic { font-size:56px; }
  #scrPad .opt.has-reveal .face-word { font-size:28px; }
  #scrPad .opt.pic .reveal { font-size:34px; }
  #scrPad .opt.word .reveal, #scrPad .opt.tpr .reveal { font-size:52px; }
  #scrPad .s-bottom { height:112px; }
  #scrPad .s-bottom .hint { font-size:17px; }
  #scrPad .replay { padding:16px 60px; font-size:21px; }
  #scrPad .exit { width:42px; height:42px; font-size:19px; }
  #scrPad .chip { font-size:12px; }
  #scrPad .stars { font-size:23px; }
  #scrPad .prog { font-size:17px; }
  /* 聆听跟读卡：横屏大版 */
  #scrPad .listen-card { padding:38px 44px; gap:16px; }
  #scrPad .listen-en { font-size:36px; }
  #scrPad .listen-zh { font-size:17px; }
  #scrPad .listen-badge { font-size:12px; }
  /* 完成页横版 */
  #scrPad .done { font-size:30px; }
  /* 地图页：两列网格（横屏空间利用） */
  #scrPad .map { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; align-content:start; padding:20px 28px 26px; }
  #scrPad .map h1 { grid-column:1/-1; text-align:center; margin-top:12px; }
  #scrPad .map .slogan { grid-column:1/-1; text-align:center; }
  #scrPad .map .theme-card { grid-column:1/-1; margin-top:10px; }
  #scrPad .map .level-row { margin-top:0; padding:16px 18px; }
  #scrPad .map .level-row.all { grid-column:1/-1; }   /* 全部连练：横跨两列通栏 */
  #scrPad .map .tip { grid-column:1/-1; margin-top:10px; }
  #scrPad .lv-badge { width:54px; height:54px; border-radius:17px; font-size:17px; }
  #scrPad .lv-name { font-size:17px; }
  #scrPad .lv-desc { font-size:12.5px; }
  #scrPad .lv-arrow { font-size:25px; }
  #scrPad .map-top { grid-column:1/-1; margin-bottom:4px; }
  #scrPad .map-top .map-title { font-size:18px; }
</style>
</head>
<body>
  <div class="toolbar">
    <b style="color:var(--text-brown)">稳稳学英语 v0.2 · 两轮模式验证器</b>
    <select id="voiceSel" title="发音方案">
      <option value="aria" selected>👩 真人女声·Aria（全量67卡）</option>
      <option value="system">🤖 系统TTS(兜底)</option>
    </select>
    <button id="btnSound">🔊 语音/音效 开</button>
    <span class="note">左=手机竖屏(360dp) 右=平板横屏(独立布局)｜主题一全67卡六档关卡｜每题真人发声2遍·间隔2秒｜答错入复习池(↻)｜✕随时退出</span>
  </div>

  <div class="screens">
    <div class="device phone"><div class="screen" id="scrPhone"></div></div>
    <div class="device pad"><div class="screen" id="scrPad"></div></div>
  </div>

  <div class="log" id="log"></div>

<script>
/* ================= 数据：主题一 body 全量（与 body.csv 67 卡对齐） ================= */
/* 单词→插画（AI 按基准样图风格生成，2026-11-05）；加载失败回退 emoji */
const BODY_IMG = {
  head:"head", hair:"hair", eye:"eye", ear:"ear", nose:"nose", mouth:"mouth",
  tooth:"tooth", hand:"hand", arm:"arm", leg:"leg", foot:"foot", face:"face",
  shoulder:"shoulder", knee:"knee", finger:"finger", toe:"toe", tummy:"tummy", back:"back", neck:"neck", smile:"smile",
  touch:"touch", point:"point", clap:"clap", jump:"jump", run:"run", walk:"walk", wash:"wash", brush:"brush",
  stop:"stop", go:"go", look:"look",
  "two eyes":"two-eyes", "one nose":"one-nose", "red mouth":"red-mouth"
};
const BODY_EMOJI = {
  head:"👤", hair:"💇", eye:"👁️", ear:"👂", nose:"👃", mouth:"👄",
  tooth:"🦷", hand:"✋", arm:"💪", leg:"🦵", foot:"🦶", face:"😀",
  shoulder:"🏋️", knee:"🦸", finger:"👆", toe:"🐾", tummy:"🫄", back:"🧘", neck:"🦒", smile:"😊",
  touch:"🤲", point:"👉", clap:"👏", jump:"🤾", run:"🏃", walk:"🚶", wash:"🧼", brush:"🪥",
  stop:"✋", go:"🏃", look:"👀",

let WORD_POOL = [];   // 供干扰项抽取的词表（loadIndex 后填充）
function buildOptions(card){
  const ty = card.type || "word";
  if(ty === "word" || ty === "phrase"){
    const correct = card.en.toLowerCase();
    const pool = WORD_POOL.filter(t => t !== correct).sort(() => Math.random() - .5);
    const n = card.opts || 2;                         // L1=2选，L2+可4选
    return [correct, ...pool.slice(0, n-1)].sort(() => Math.random() - .5);
  }
  if(ty === "sentence"){
    // L3 TPR：听指令，选对应场景图（句子→去标点尾词/关键词匹配 emoji）
    const kw = sentenceKey(card.en);
    const correct = kw;
    const pool = Object.keys(EMOJI).filter(t => t !== correct).sort(() => Math.random() - .5);
    const distractors = pool.filter(t => !kw.startsWith(t)).slice(0, 3);
    return [correct, ...distractors].sort(() => Math.random() - .5);
  }
  if(ty === "qa" || ty === "retell" || ty === "inquire" || ty === "dialog" || ty === "story"){
    // L4-L6：句子卡不选图 → 听后跟读（REC 引导，不计对错，逐句出）
    return [];
  }
  return [card.en.toLowerCase()];
}
/* 句子→关键词映射（L3 TPR 用，随主题：body 用身体部位、food 用食物） */
function sentenceKey(en){
  const e = en.toLowerCase();
  if(curTheme === 'food'){
    if(/hungry/.test(e)) return "hungry";
    if(/apple/.test(e)) return "apple";
    if(/water/.test(e)) return "water";
    if(/yummy/.test(e)) return "yummy";
    if(/egg/.test(e)) return "egg";
    if(/dinner/.test(e)) return "dinner";
    if(/fish/.test(e)) return "fish";
    if(/milk/.test(e)) return "milk";
    return "apple";
  }
  if(/nose/.test(e)) return "nose";
  if(/hands?\b/.test(e) && /clap/.test(e)) return "clap";
  if(/jump/.test(e)) return "jump";
  if(/wash/.test(e) && /hand/.test(e)) return "wash";
  if(e.includes("mouth")) return "mouth";
  if(/foot/.test(e)) return "foot";
  if(/eyes/.test(e)) return ( "eye" );
  if(/body/.test(e)) return "face";   // shake body 暂用语态近义
  return "face";
}

const audioCache = {};
/* 系统TTS兜底：优选秀美式女声（仅在音频缺失/被拦时使用） */
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if(!vs.length) return;
  const enUS = vs.filter(v => /en[-_]US/i.test(v.lang));
  const anyEn = vs.filter(v => /^en/i.test(v.lang));
  const prefs = [/Zira/i, /Aria/i, /Jenny/i, /Michelle/i, /Samantha/i, /Google US English/i, /female/i];
  for(const p of prefs){
    const v = enUS.find(x => p.test(x.name)) || anyEn.find(x => p.test(x.name));
    if(!v) continue;
    if(voice && voice.name === v.name) return;
    voice = v;
    log(`兜底TTS可用：${v.name}`);
    return;
  }
  if(!voice){ voice = enUS[0] || anyEn[0] || vs[0]; }
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speakTts(text, rate){
  if(!soundOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.lang = "en-US"; u.rate = rate || 0.9; u.pitch = 1.06;
  speechSynthesis.speak(u);
}
/* 播预生成的真人音频；缺文件/被拦截 → 回退系统TTS */
function playWord(text, rate){
  const key = audioKeyOf(text);
  let a = audioCache[key];
  if(!a){
    let failed = false;
    a = new Audio(`${AUDIO_DIR}/${key}.mp3`);
    const fallback = () => { if(failed) return; failed = true; delete audioCache[key]; log(`⚠ 音频缺失(${key})→系统TTS兜底`); speakTts(text, rate); };
    a.onerror = fallback;
    audioCache[key] = a;
    try{ a.currentTime = 0; }catch(e){}
    a.playbackRate = (rate && rate < 0.9) ? 0.85 : 1;
    const p = a.play();
    if(p && p.catch) p.catch(fallback);
    return;
  }
  try{ a.currentTime = 0; }catch(e){}
  a.playbackRate = (rate && rate < 0.9) ? 0.85 : 1;
  const p2 = a.play();
  if(p2 && p2.catch) p2.catch(()=> speakTts(text, rate));
}

let AUDIO_INDEX = {};

    (async () => {
      const miss = [];
      for(const c of CARDS){
        const k = audioKeyOf(c.en);
        try{
          const r = await fetch(`${AUDIO_DIR}/${k}.mp3`, { method: "HEAD" });
          if(r.status !== 200) miss.push(`${c.en}(${k})`);
        }catch(e){ miss.push(`${c.en}(${k})`); }
      }
      if(miss.length === 0) log(`✅ 真人发音核验通过：${CARDS.length}/${CARDS.length} 张卡全部命中本地音频`);
      else log(`⛔ 真人发音缺失 ${miss.length} 张：${miss.join("、")}（请重新生成音频）`);
    })();
  }).catch(() => {
    WORD_POOL = Object.keys(EMOJI);
    log("⚠ 未取到音频索引，干扰项回退 emoji 词池");
  });
})();
function audioKeyOf(en){
  const w = en.trim().toLowerCase();
  const hit = AUDIO_INDEX[w];
  if(hit) return hit;
  // 未命中索引 → 用 slug 规则猜 filename（与 gen_body_audio.py 的 re.sub 规则一致）
  const s1 = String(w).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  let s2 = s1.slice(0, 40);
  s2 = s2.replace(/-+$/g, "");
  return (s2.startsWith("-") ? s2.slice(1) : s2) || "x";
}

/* ============ 音效：Web Audio 合成（正式版换 App 内置资源音） ============ */
let actx = null;
function audioCtx(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freqs, dur, type, vol, gap){
  const ac = audioCtx(); if(!ac || !soundOn) return;
  freqs.forEach((f, i) => {
    const t = ac.currentTime + i * gap;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .015);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + .03);
  });
}

  if(scope === "l1" || scope === "all"){
    // L1：核心单词，看图轮 + 认词轮两轮
    const l1 = isFood
      ? CARDS.filter(c => c.unit === "u1" || c.unit === "u2")
      : CARDS.filter(c => c.zh && !c.type && ["头","头发","眼睛","耳朵","鼻子","嘴巴","牙齿","手","手臂","腿","脚","脸"].includes(c.zh));
    const u1 = isFood ? l1.filter(c=>c.unit==="u1") : l1.slice(0,6);
    const u2 = isFood ? l1.filter(c=>c.unit==="u2") : l1.slice(6,12);
    u1.concat(u2).forEach(c => items.push(cardItem(c, "pic")));
    u1.concat(u2).forEach(c => items.push(cardItem(c, "word")));
    lastWordItems = items.slice();
  }
  if(scope === "l2" || scope === "all"){
    // L2：扩展词四选 + 短语四选
    const l2w = isFood
      ? CARDS.filter(c => c.unit === "l2u1" || c.unit === "l2u2")
      : CARDS.filter(c => !c.type && ["肩","膝盖","手指","脚趾","肚子","背","脖子","微笑","触摸","指","拍手","跳","跑","走","洗","刷"].includes(c.zh));
    l2w.forEach(c => items.push(cardItem({...c, opts:4}, "pic")));
    const l2p = isFood
      ? CARDS.filter(c => c.unit === "l2u3")
      : CARDS.filter(ty("phrase"));
    l2p.forEach(c => items.push(cardItem({...c, opts:4}, "pic")));
  }
  if(scope === "l3" || scope === "all"){
    CARDS.filter(ty("sentence")).forEach(c => items.push(cardItem(c, "tpr")));
  }
  if(scope === "l4" || scope === "all"){
    CARDS.filter(c => ["qa","retell","inquire"].includes(c.type)).forEach(c => items.push(cardItem(c, "listen")));
  }
  if(scope === "l5" || scope === "all"){
    CARDS.filter(ty("dialog")).forEach(c => items.push(cardItem(c, "listen")));
  }
  if(scope === "l6" || scope === "all"){
    CARDS.filter(ty("story")).forEach(c => items.push(cardItem(c, "listen")));
  }
  idx=0; stars=0; attempt=0;
  window.__scope = scope;
}

/* 统一延时器：退出/开新会话即作废；确认浮层打开时自动挂起 */
function later(ms, fn){
  const sid = sessionToken;
  const tick = () => {
    if(sid !== sessionToken) return;
    if(document.querySelector('.exit-mask')){ setTimeout(tick, 130); return; }
    fn();
  };
  setTimeout(tick, ms);
}

/* ============ 间隔复习（§5.2：错题入池→L1 每3张新卡夹1张复习=隔2题重出） ============ */
function queueReview(item, teach){
  // 复习卡本身答错不再重插（同日阶梯内不再出），同卡防重复入池
  if(item.review || item.queued) return;
  item.queued = true;
  // §5.3 题面变换：重洗干扰项与位置（buildOptions 每次随机）；仍计星 +1★
  const ri = {card:item.card, mode:item.mode, review:true, options:buildOptions(item.card)};
  // 插入位置：当前题后第3位（隔2题），且不得越出本轮轮次段
  let endOfRound = items.length;
  for(let j=idx+1;j<items.length;j++){ if(items[j].mode!==item.mode){ endOfRound=j; break; } }
  items.splice(Math.min(idx+3, endOfRound), 0, ri);
  log(`[${item.card.en}]${teach?"连错2次":"首答错误"} → 入复习池(${teach?"优先级：最高":"优先级：高"})，隔2题后重出 ↻`);
}

/* ============ 判定（三态，与 SessionEngine 一致；tpr 按句子关键词判） ============ */
function judge(item, picked, n){
  const correctKey = item.mode==="tpr" ? sentenceKey(item.card.en) : item.card.en.toLowerCase();
  const correct = picked === correctKey;
  if(correct && n===1){
    if(item.review) log(`复习卡[${item.card.en}]首答对 → 间隔阶梯进一级(${"同日→隔1天→隔3天→隔7天"})`);
    return {correct:true, stars:1, teach:false};
  }
  if(correct) return {correct:true, stars:0, teach:false};
  if(n>=2){
    log(`[${item.card.en}]连错2次 → 示范态（高亮+亮答案+示范音2遍）`);
    queueReview(item, true);
    return {correct:false, stars:0, teach:true};
  }
  log(`[${item.card.en}]首答错 → 给第2次机会`);
  queueReview(item, false);
  return {correct:false, stars:0, teach:false};
}

const MODE_INFO = {
  pic:  {chip:"看图·听音选图", cls:"chip.pic"},
  word: {chip:"认词·听音选词", cls:"chip.word"},
  tpr:  {chip:"L3·听指令选动作", cls:"chip.pic"},
  listen:{chip:"听一听·跟一跟", cls:"chip.word"}
};
const TYPE_BADGE = {qa:"问答", retell:"复述", inquire:"主动提问", dialog:"对话", story:"叙述"};
function renderSession(screen){
  const cur = items[idx];
  if(!cur){ renderDone(screen); return; }
  attempt=0; busy=false;

  const mode = cur.mode;
  const ty = cur.card.type || "word";
  const samePhase = items.filter(i => i.mode === mode).length;
  const withinRound = items.slice(0, idx+1).filter(i => i.mode === mode).length;
  if(mode==="word" && (idx===0 || items[idx-1].mode==="pic")){
    log("🔁 进入第二轮：认词模式（卡片只显示单词，答对亮图片）");
  }
  if(mode==="listen" && (idx===0 || items[idx-1].mode!=="listen")){
    log("🎧 进入聆听跟读模式（L4-L6 句卡：听→看→跟读，不计对错只计星）");
  }

  let gridHtml = "";
  if(mode === "listen"){
    // L4-L6：句子卡展示 + 真录音评测（讯飞引擎，本地代理转发）
    const c = cur.card;
    gridHtml = `
      <div class="listen-card anim-in">
        <div class="listen-en" id="len_${screen.id}">${c.en}</div>
        <div class="listen-zh">${c.zh}</div>
        <div class="listen-badge">${TYPE_BADGE[ty] || ty}</div>
        <div class="rec-area">
          <button class="mic-btn" id="mic_${screen.id}" onclick="toggleRec('${screen.id}')" title="跟读录音">🎤</button>
          <div class="mic-tip" id="mtip_${screen.id}">点麦克风，跟着读一遍</div>
          <div class="rec-result" id="mres_${screen.id}"></div>
        </div>
      </div>`;
  } else {
    const two = cur.options.length===2;
    let cols = two ? 1 : 2;
    if(screen.id==="scrPad") cols = two ? 2 : 2;   // 平板横屏：2选项并排一行、4选项 2x2
    const rows = Math.ceil(cur.options.length / cols);
    let colorIdx=0;
    for(let r=0; r<rows; r++){
      let rowCells = "";
      for(let c=0;c<cols;c++){
        const opt = cur.options[r*cols+c]; if(!opt) break;
      const face = (mode === "pic" || mode === "tpr" || ty === "phrase") && IMG[opt]
        ? `<div class="face-pic"><img src="img/${IMG[opt]}.jpg" alt="${opt}" loading="lazy" onerror="this.parentNode.textContent='${EMOJI[opt] || '❓'}'"></div>`  // 看图/TPR/短语：插画（回退emoji）
        : (mode === "pic" || mode === "tpr")
          ? `<div class="face-pic">${EMOJI[opt]}</div>`
          : `<div class="face-word">${opt.toUpperCase()}</div>`; // 认词轮：只有单词
        rowCells += `<div class="opt ${mode} anim-in" style="background:${PASTEL[colorIdx%4]}; animation-delay:${(colorIdx++)*90}ms"
          onclick="tapOpt(this,'${opt}')">${face}</div>`;
      }
      gridHtml += `<div class="s-row">${rowCells}</div>`;
    }
  }
  const mi = MODE_INFO[mode] || MODE_INFO.pic;
  const inListen = mode === "listen";
  screen.innerHTML = `
    <div class="session">
      <div class="s-top">
        <button class="exit" onclick="requestExit()" title="退出学习">✕</button>
        <div class="prog">
          <span class="chip ${mode==="pic"||mode==="tpr"?"pic":"word"}">${mi.chip}</span>
          (${withinRound}/${samePhase})${cur.review?' ↻':''}
        </div>
        <div class="stars" id="stars_${screen.id}">★ ${stars}</div>
      </div>
      <div class="s-grid">${gridHtml}</div>
      <div class="s-bottom">
        <div class="hint" id="hint_${screen.id}"></div>
        <div class="row2">
          ${inListen
            ? `<button class="replay" onclick="nextListen()">下一句 →</button>`
            : `<button class="replay" id="rp_${screen.id}" onclick="replay()">🔊 再听一次</button>`}
          ${inListen ? `` : `<div id="rslot_${screen.id}" style="display:contents"></div>`}
        </div>
      </div>
    </div>`;
  const optDesc = (mode==="pic"||mode==="tpr") ? cur.options.map(o=>EMOJI[o]).join(" ") : cur.options.join("/").toUpperCase();
  log(`[${(MODE_INFO[mode]||MODE_INFO.pic).chip}] 出题 ${withinRound}/${samePhase}：${cur.card.en}${cur.review?"（复习卡）":""}${optDesc?" 选项="+optDesc:""}`);
}

/* ============ 答题：核心 reveal 机制 ============ */
function tapOpt(el, picked){
  if(busy) return;
  busy = true;
  autoPlaySeq++;                      // 孩子已作答：取消本题未播的自动播题
  const cur = items[idx];
  const r = judge(cur, picked, ++attempt);
  const phone = document.getElementById("scrPhone").contains(el) ? "scrPhone" : "scrPad";
  const hint = document.getElementById("hint_"+phone);
  const starsEl = document.getElementById("stars_"+phone);

  if(r.correct){
    stars += r.stars;
    if(starsEl) starsEl.textContent = "★ "+stars;
    // ★ 揭示：看图轮→亮出单词；认词轮→亮出插画（回退emoji）
    const revKey = cur.card.en.toLowerCase();
    const revealHtml = (cur.mode==="pic" || cur.mode==="tpr")
      ? `<div class="reveal">${cur.card.en.toUpperCase()}</div>`
      : IMG[revKey]
        ? `<div class="reveal"><img src="img/${IMG[revKey]}.jpg" alt="${revKey}" onerror="this.parentNode.textContent='${EMOJI[revKey] || "❓"}'"></div>`
        : `<div class="reveal">${EMOJI[revKey] || cur.card.en.toUpperCase()}</div>`;
    el.insertAdjacentHTML("beforeend", revealHtml);
    el.classList.add("answer-ring","anim-cheer","has-reveal");
    if(r.stars>0) log(`✔ ${cur.card.en} 首答对 +1★（累计${stars}★）`);
    else log(`✔ ${cur.card.en} 二答对 +0★（不惩罚）`);
    const praise = r.stars>0 ? "太棒了！+1★ " : "不错哦～ ";
    if(hint) hint.textContent = praise + ((cur.mode==="pic"||cur.mode==="tpr") ? "这就是 "+cur.card.en : "就是这个！");
    SFX[r.stars>0 ? "correct" : "soft"]();
    later(180, ()=>speak(cur.card.en));
    // 跟读得星：答对后揭示期「再听一次」旁出现「跟读」按钮；2.4s 后自动进下一题，
    // 但若点了跟读则暂停自动推进，直到出分再走（听得对+说得对）
    const slot = document.getElementById("rslot_"+phone);
    window.__recActive = false;
    if(slot && cur.mode !== "listen"){
      slot.innerHTML = `<button class="btn-rec-w" onclick="startWordRec(this,'${phone}')">🎤 跟读</button><span class="rec-mini-result" id="mr_${phone}"></span>`;
    }
    const tickNext = () => {
      if(window.__recActive) { later(900, tickNext); return; }   // 跟读中/评分中：挂起
      if(items[idx] === cur){ idx++; renderSessionAll(); }
    };
    later(2400, tickNext);
  } else if(r.teach){
    el.classList.add("anim-wrong");
    if(hint) hint.textContent = "跟我读一遍～";
    const correctKey = cur.mode==="tpr" ? sentenceKey(cur.card.en) : cur.card.en.toLowerCase();
    const correctBtn = [...document.querySelectorAll('#'+phone+' .opt')].find(b => b.getAttribute('onclick').includes(`'${correctKey}'`));
    if(correctBtn){
      correctBtn.classList.add("highlight-correct","has-reveal");
      const revKey2 = cur.card.en.toLowerCase();
      const reveal = (cur.mode==="pic"||cur.mode==="tpr")
        ? `<div class="reveal">${cur.card.en.toUpperCase()}</div>`
        : IMG[revKey2]
          ? `<div class="reveal"><img src="img/${IMG[revKey2]}.jpg" alt="${revKey2}" onerror="this.parentNode.textContent='${EMOJI[revKey2] || "❓"}'"></div>`
          : `<div class="reveal">${EMOJI[revKey2] || cur.card.en.toUpperCase()}</div>`;
      correctBtn.insertAdjacentHTML("beforeend", reveal);
    }
    SFX.demo();                                   // 示范态提示音
    later(150, ()=>speak(cur.card.en, .8));        // 示范读得慢一些
    later(1350, ()=>speak(cur.card.en, .8));
    later(2700, ()=>{ idx++; renderSessionAll(); });
  } else {
    el.classList.add("anim-wrong");
    if(hint) hint.textContent = "再听一次～";
    SFX.wrong();                                  // 答错音效：温和低音
    later(160, ()=>speak(cur.card.en));
    later(500, ()=>{ busy=false; });
  }
}

function replay(){
  const cur = items[idx]; if(!cur) return;
  speak(cur.card.en);
  log(`手动重听：${cur.card.en}`);
}
/* ============ 单词题跟读：答对揭示后「跟读」按钮（讯飞评测追加星星） ============ */
async function startWordRec(btn, phone){
  if(recBusy) { stopRecAll(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    log("⛔ 浏览器不支持录音，跟读不可用");
    return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount:1, echoCancellation:true, noiseSuppression:true } });
    const mime = ["audio/wav", "audio/webm;codecs=opus", "audio/webm"].find(m => MediaRecorder.isTypeSupported(m));
    recChunks = [];
    mediaRec = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
    mediaRec.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => finishWordRec(btn, phone, mediaRec.mimeType || "");
    mediaRec.start();
    recBusy = true; window.__recActive = true;      // 挂起自动推进
    btn.classList.add("recording"); btn.textContent = "⏹ 停止";
    log("🎤 单词跟读录音中：" + items[idx].card.en);
    setTimeout(()=>{ if(recBusy) stopRecAll(); }, 8000);
  }catch(err){
    window.__recActive = false;
    log("⛔ 麦克风失败: " + (err.message || err));
    btn.textContent = "🎤 重试";
  }
}
async function finishWordRec(btn, phone, mime){
  window.__recActive = true;                        // 评分阶段仍挂起推进
  const mr = document.getElementById("mr_" + phone);
  if(mr) mr.textContent = "评分中…";
  const blob = new Blob(recChunks, { type: mime || "audio/webm" });
  if(blob.size < 2000){
    if(mr) mr.textContent = "没录到，再试";
    window.__recActive = false; stopRecAll(); return;
  }
  const cur = items[idx];
  try{
    const wavB64 = await blobToWav16k(blob);
    const r = await fetch(ISE_PROXY, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ wav_b64: wavB64, text: cur.card.en, category: cur.card.en.includes(" ") ? "sentence" : "word" }) });
    const j = await r.json();
    if(!j.ok){ if(mr) mr.textContent = "评测没成功"; log("⛔ 跟读评测失败: " + (j.error||"").slice(0,60)); }
    else{
      const st = "★".repeat(j.stars) + "☆".repeat(3-j.stars);
      if(mr) mr.innerHTML = `<span class="rec-stars">${st}</span> ${j.score100}分`;
      if(j.stars > 0){ stars += j.stars; document.querySelectorAll('.stars').forEach(e => e.textContent = "★ "+stars); }
      log(`🎤 单词跟读 ${cur.card.en}：${j.score100}分 ${"★".repeat(j.stars)}（累计${stars}★）`);
      SFX.soft();
    }
  }catch(err){
    if(mr) mr.textContent = "服务未连接";
    log("⛔ 代理不可达: " + (err.message||err));
  }
  window.__recActive = false;                       // 恢复自动推进
  stopRecAll();
}

/* ============ 跟读录音评测（讯飞引擎，本地代理 http://127.0.0.1:8766/eval） ============ */
const ISE_PROXY = "http://127.0.0.1:8766/eval";
let mediaRec = null, recChunks = [], recStream = null, recBusy = false;
async function toggleRec(sid){
  const btn = document.getElementById("mic_"+sid);
  if(!btn) return;
  if(recBusy){ stopRecAll(); return; }
  if(btn.classList.contains("recording")){ stopRecAll(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    showRecErr(sid, "当前浏览器不支持麦克风录音（请用 Chrome/Edge 打开）");
    log("⛔ 浏览器不支持 MediaRecorder");
    return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount:1, echoCancellation:true, noiseSuppression:true } });
    // 优先 wav 原始录音（讯飞要 16k/16bit/mono PCM-WAV）
    const mime = ["audio/wav", "audio/webm;codecs=opus", "audio/webm"].find(m => MediaRecorder.isTypeSupported(m));
    recChunks = [];
    mediaRec = new MediaRecorder(recStream, mime ? { mimeType: mime, audioBitsPerSecond: 16000 } : undefined);
    mediaRec.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = () => finishRec(sid, mediaRec.mimeType || "");
    mediaRec.start();
    recBusy = true;
    btn.classList.add("recording"); btn.textContent = "⏹";
    const tip = document.getElementById("mtip_"+sid);
    if(tip) tip.textContent = "录音中…跟着大声读，读完点 ⏹";
    document.querySelectorAll('.mic-btn').forEach(b => { if(b.id !== "mic_"+sid){ b.classList.add("recording"); b.textContent = "⏹"; } });
    log("🎤 开始跟读录音（" + (mediaRec.mimeType || "默认") + "）");
    setTimeout(()=>{ if(recBusy) stopRecAll(); }, 12000);   // 最长12秒自动停
  }catch(err){
    showRecErr(sid, "麦克风不可用：" + (err && err.name === "NotAllowedError" ? "浏览器拒绝了麦克风权限" : (err.message || err)));
    log("⛔ 麦克风失败: " + (err.message || err));
  }
}
function stopRecAll(){
  if(mediaRec && mediaRec.state !== "inactive") mediaRec.stop();
  if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  recBusy = false;
  document.querySelectorAll('.mic-btn').forEach(b => { b.classList.remove("recording"); b.textContent = "🎤"; });
}
async function finishRec(sid, mime){
  const tip = document.getElementById("mtip_"+sid);
  const res = document.getElementById("mres_"+sid);
  document.querySelectorAll('.mic-tip, .rec-result').forEach(e => { if(e.id && !e.id.endsWith(sid)) e.textContent = ""; });
  if(tip) tip.textContent = "评分中…";
  if(res) res.innerHTML = `<div class="rec-loading">AI 评测中，稍等一下…</div>`;
  const blob = new Blob(recChunks, { type: mime || "audio/webm" });
  if(blob.size < 2000){ if(res) res.innerHTML = ""; if(tip) tip.textContent = "没录到声音，再试一次"; log("⛔ 录音过短"); return; }
  const cur = items[idx];
  try{
    // webm/opus → 需要 16k PCM wav：用 OfflineAudioContext 重采样
    const wavB64 = await blobToWav16k(blob);
    const r = await fetch(ISE_PROXY, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ wav_b64: wavB64, text: cur.card.en, category: cur.card.en.includes(" ") ? "sentence" : "word" }) });
    const j = await r.json();
    if(!j.ok){ if(res) res.innerHTML = `<div class="rec-err">${j.error || "评测失败"}</div>`; if(tip) tip.textContent = "再读一次试试"; log("⛔ 评测失败: " + (j.error||"").slice(0,80)); return; }
    const starsTxt = "★".repeat(j.stars) + "☆".repeat(3 - j.stars);
    if(res) res.innerHTML = `<div class="rec-stars">${starsTxt}</div><div class="rec-score">发音得分 ${j.score100} 分</div>`;
    if(tip) tip.textContent = j.stars >= 2 ? "很棒！点「下一句」继续" : "再多听几遍，一定能更棒";
    if(j.stars > 0){ stars += j.stars; document.querySelectorAll('.stars').forEach(e => e.textContent = "★ "+stars); }
    log(`🎤 跟读评测：${cur.card.en} → ${j.score100}分 ${"★".repeat(j.stars)}（累计${stars}★）`);
  }catch(err){
    if(res) res.innerHTML = `<div class="rec-err">代理服务未启动（127.0.0.1:8766），或网络异常</div>`;
    if(tip) tip.textContent = "";
    log("⛔ 代理不可达: " + (err.message || err));
  }
}
async function blobToWav16k(blob){
  const ab = await blob.arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ac.decodeAudioData(ab);
  await ac.close();
  // OfflineAudioContext 重采样到 16k
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const rendered = await off.startRendering();
  const pcm = rendered.getChannelData(0);
  // float32 → int16
  const len = pcm.length;
  const bytes = new Uint8Array(44 + len * 2);
  const dv = new DataView(bytes.buffer);
  const ws = (off, s) => dv.setUint32(off, s, true);
  const wstr = (off, s) => { for(let i=0;i<s.length;i++) dv.setUint8(off+i, s.charCodeAt(i)); };
  wstr(0, "RIFF"); ws(4, 36 + len*2); wstr(8, "WAVE"); wstr(12, "fmt ");
  ws(16, 16); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); ws(24, 16000); ws(28, 32000);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); wstr(36, "data"); ws(40, len*2);
  for(let i=0;i<len;i++){ const v = Math.max(-1, Math.min(1, pcm[i])); dv.setInt16(44+i*2, v<0 ? v*32768 : v*32767, true); }
  // Uint8Array → base64（分块避免栈溢出）
  let bin = ""; const CH = 32768;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin);
}
function showRecErr(sid, msg){
  const res = document.getElementById("mres_"+sid);
  if(res) res.innerHTML = `<div class="rec-err">${msg}</div>`;
}
function nextListen(){
  const cur = items[idx]; if(!cur) return;
  stopRecAll();
  idx++; renderSessionAll();
}

function speak(text, rate){
  if(!soundOn) return;
  if(curVoice === "system"){ speakTts(text, rate); return; }   // 手动切到系统TTS才走合成
  playWord(text, rate);                                        // 默认一律真人音频
}

/* ============ 课中随时退出（✕ → 确认浮层：继续/退出），浮层打开时挂起计时 ============ */
function requestExit(){
  if(document.querySelector('.exit-mask')) return;
  document.querySelectorAll('.screen').forEach(sc => {
    const mask = document.createElement('div');
    mask.className = 'exit-mask';
    mask.setAttribute('onclick', 'if(event.target===this) hideExit()');
    mask.innerHTML = `
      <div class="exit-card">
        <div class="exit-title">要退出学习吗？</div>
        <div class="exit-stars">第 ${Math.min(idx+1, items.length)}/${items.length} 题 · 已得 ${stars} ★</div>
        <div class="exit-btns">
          <button class="exit-keep" onclick="hideExit()">继续学习</button>
          <button class="exit-quit" onclick="doExit()">退出</button>
        </div>
      </div>`;
    sc.appendChild(mask);
  });
  log(`✕ 请求退出（进度 ${Math.min(idx+1,items.length)}/${items.length} 题、${stars}★）→ 计时挂起中`);
}
function hideExit(){
  document.querySelectorAll('.exit-mask').forEach(m => m.remove());
  log('继续学习 → 计时恢复');
}
function doExit(){
  document.querySelectorAll('.exit-mask').forEach(m => m.remove());
  sessionToken++;                            // 未决计时全部作废
  busy = false;
  if(soundOn && window.speechSynthesis) speechSynthesis.cancel();
  log(`↩ 已退出（进度 ${Math.min(idx+1,items.length)}/${items.length} 题、得 ${stars}★）→ 返回${curLevel?"该难度档主题":"首页难度"}`);
  goBackFromSession();
}
function goBackFromSession(){
  curLevel ? renderThemeLevel(curLevel) : renderBothMap();
}

function renderDone(screen){
  screen.innerHTML = `<div class="done" onclick="goBackFromSession()">今天到这啦！<br><br>+${stars}★<br><span style="font-size:13px;color:var(--text-hint)">点任意处返回</span></div>`;
  if(screen.id==="scrPhone"){ SFX.finish(); log(`🎉 会话完成：两轮共${items.length}题，得${stars}星`); }
}
function renderBothMap(){
  renderMap(document.getElementById("scrPhone"));
  renderMap(document.getElementById("scrPad"));
}

document.getElementById("btnSound").onclick = function(){
  soundOn = !soundOn;
  this.className = soundOn ? "" : "off";
  this.textContent = soundOn ? "🔊 语音/音效 开" : "🔇 语音/音效 关";
  if(!soundOn && window.speechSynthesis) speechSynthesis.cancel();
  log(soundOn ? `语音/音效已开（${VOICES[curVoice].label} + 合成音效）` : "语音/音效已关");
};
document.getElementById("voiceSel").onchange = function(){
  curVoice = this.value;
  log(`🎤 发音人切换：${VOICES[curVoice].label}`);
  speak("Head");   // 立即试听
};

renderBothMap();
