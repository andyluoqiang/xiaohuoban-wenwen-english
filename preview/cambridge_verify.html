<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>稳稳学英语 · 剑桥岛验证器 v4（10主题·点词查义全覆盖）</title>
<style>
  :root { --bg:#FFF6EA; --brown:#4E342E; --hint:#A1887F; --green:#5BBFA0; --greend:#3E9D80; --bad:#C62828; --blue:#4FA3D1; }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:var(--bg); margin:0; padding:18px; color:var(--brown); }
  h1 { font-size:21px; margin:0 0 4px; }
  h2 { font-size:16px; color:var(--greend); border-bottom:2px solid #AED581; padding-bottom:5px; margin:26px 0 10px; }
  .ok { color:#2E7D32; font-weight:700; }
  .bad { color:var(--bad); font-weight:700; }
  .panel { background:#fff; border-radius:16px; padding:14px; box-shadow:0 3px 10px rgba(0,0,0,.07); margin-top:10px; }
  table { border-collapse:collapse; font-size:12.5px; background:#fff; width:100%; }
  td,th { border:1px solid #E0D5C8; padding:5px 9px; text-align:left; }
  .btn { background:var(--green); color:#fff; border:none; border-radius:18px; padding:9px 20px; font-size:14px; cursor:pointer; margin:3px; font-weight:700; }
  .btn.sel { background:var(--greend); outline:3px solid #FFD166; }
  .btn.purple { background:#AB83BD; }
  .lesson { background:#FFF3E0; border-radius:18px; padding:12px 16px; margin-top:10px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .lesson:hover { filter:brightness(.97); }
  .lesson.all { background:#E8F5EE; outline:2px solid var(--green); }
  .l-title { flex:1; }
  .l-title b { font-size:16px; }
  .l-title div { font-size:12px; color:var(--hint); }
  .l-progress { font-size:14px; font-weight:800; }
  .stepbox { background:#fff; border-radius:20px; padding:18px; margin-top:10px; text-align:center; }
  .opt-img { display:inline-flex; flex-direction:column; align-items:center; width:150px; margin:6px; cursor:pointer; background:#FFF6EA; border-radius:18px; padding:8px; }
  .opt-img img { width:120px; height:120px; object-fit:contain; }
  .opt-word { display:inline-block; min-width:150px; margin:8px; padding:16px 22px; border-radius:24px; color:#fff; font-size:24px; font-weight:800; cursor:pointer; }
  .reveal { text-align:center; }
  .reveal img { width:230px; height:230px; object-fit:contain; }
  .reveal .en { font-size:34px; font-weight:900; }
  .reveal .zh { font-size:17px; color:var(--hint); }
  .chip { display:inline-block; padding:5px 12px; margin:3px; border-radius:13px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.12); cursor:pointer; font-size:17px; font-weight:700; color:var(--brown); }
  #popup { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9; align-items:center; justify-content:center; }
  #popup .card { background:#fff; border-radius:26px; padding:26px 34px; text-align:center; }
  .muted { color:var(--hint); font-size:12px; }
  #verdict { font-size:14px; margin-top:4px; }
  .stat { font-size:13px; margin-top:8px; font-weight:700; }
</style>
</head>
<body>
<h1>🧪 稳稳学英语 · 剑桥岛验证器 v4 <span id="verdict">数据加载中…</span></h1>
<div class="muted">v4 检查范围：①数据完整性 ②课程树（10主题×6档位）③双步学习 ④随机课 ⑤点词查义 ⑥6 新主题扩充 ⑦<b>点词查义全覆盖</b>（所有句卡词 100% 收录且带真人配音、弹卡自动播放、按钮单图标）。数据源与 App assets 同源</div>

<h2>① 数据完整性（自动 12 项 + 课程树新增项）</h2>
<div class="panel" id="p1">检查中…</div>

<h2>② 课程树（选主题档位查看课程列表；完成度取 localStorage）</h2>
<div>
  <button class="btn" data-t="body" onclick="pickT('body',this)">🧒 body L1</button>
  <button class="btn" data-t="food" onclick="pickT('food',this)">🍎 food L2</button>
  <button class="btn" data-t="play" onclick="pickT('play',this)">⚽ play L1</button>
  <button class="btn sel" data-t="animals" onclick="pickT('animals',this)">🐶 animals L1</button>
  <button class="btn" data-t="animals-l2" onclick="pickT('animals-l2',this)">🐶 animals L2</button>
  <button class="btn" data-t="animals-l3" onclick="pickT('animals-l3',this)">🐶 animals L3</button>
  <button class="btn" data-t="clothes" onclick="pickT('clothes',this)">👕 clothes L1 🆕</button>
  <button class="btn" data-t="home" onclick="pickT('home',this)">🏠 home L1 🆕</button>
  <button class="btn" data-t="school" onclick="pickT('school',this)">🏫 school L1 🆕</button>
  <button class="btn" data-t="toys" onclick="pickT('toys',this)">🧸 toys L1 🆕</button>
  <button class="btn" data-t="transport" onclick="pickT('transport',this)">🚌 transport L1 🆕</button>
  <button class="btn" data-t="beach" onclick="pickT('beach',this)">🏖️ beach L1 🆕</button>
  <button class="btn" onclick="resetProgress()">清空完成记录</button>
</div>
<div id="lessons"></div>

<h2>③ 双步学习模拟器（复刻 App 状态机：图选→词选→揭示；可自动跑完整课）</h2>
<div>
  <button class="btn" onclick="simPick(1)">学 animals L1 第1课</button>
  <button class="btn" onclick="simPick(2)">学 animals L2 第1课</button>
  <button class="btn" onclick="simOpen('clothes',1,0)">👕 学 clothes L1 第1课</button>
  <button class="btn" onclick="simOpen('beach',1,0)">🏖️ 学 beach L1 第1课</button>
  <button class="btn" onclick="simAuto()">⚡ 自动跑完当前课（含错误路径）</button>
</div>
<div class="stepbox" id="sim"></div>
<div class="stat" id="simStat"></div>

<h2>④ 点词查义（句子逐词点击 → 弹卡图+释义+🔊发音）</h2>
<div id="sentences"></div>

<div id="popup" onclick="this.style.display='none'">
  <div class="card">
    <img id="popImg"><br>
    <span id="popWord" style="font-size:28px;font-weight:800"></span>
    <div id="popZh" style="font-size:15px;color:var(--hint)"></div>
    <div id="popPos" class="muted"></div>
    <button class="btn purple" style="margin-top:10px" onclick="event.stopPropagation(); playPop()">🔊　发音</button>
  </div>
</div>

<script>
const LISTEN_TYPES = ['sentence','qa','retell','inquire','dialog','story'];
const LS = 'cam_passed_v2';
const THEMES_FILES = { body:'body.json', food:'food.json', play:'play.json', animals:'animals.json',
  clothes:'clothes.json', home:'home.json', school:'school.json', toys:'toys.json', transport:'transport.json', beach:'beach.json',
  family:'family.json', rooms:'rooms.json', sports:'sports.json',
  mv_town:'mv_town.json', mv_nature:'mv_nature.json', mv_home:'mv_home.json', mv_food:'mv_food.json',
  mv_people:'mv_people.json', mv_looks:'mv_looks.json', mv_clothes:'mv_clothes.json', mv_media:'mv_media.json',
  fl_nature:'fl_nature.json', fl_animal:'fl_animal.json', fl_job:'fl_job.json', fl_place:'fl_place.json',
  fl_food:'fl_food.json', fl_object:'fl_object.json', fl_body:'fl_body.json', fl_world:'fl_world.json' };
const NEW6 = ['clothes','home','school','toys','transport','beach'];
const NEW3 = ['family','rooms','sports'];
const MV8 = ['mv_town','mv_nature','mv_home','mv_food','mv_people','mv_looks','mv_clothes','mv_media'];
const FL8 = ['fl_nature','fl_animal','fl_job','fl_place','fl_food','fl_object','fl_body','fl_world'];
let THEMES = {}, vocab, index;

(async () => {
  const loads = Object.entries(THEMES_FILES).map(async ([k,f]) => { THEMES[k] = await fetch(f).then(r=>r.json()); });
  await Promise.all([...loads,
    fetch('vocab.json').then(r=>r.json()).then(v => vocab = v),
    fetch('audio/all/index.json').then(r=>r.ok?r.json():[]).then(i => index = i||[]).catch(()=>index=[])]);
  renderSentences();   // 先渲染句子区，供点词自动播放检查真实点击
  await runChecks();
  renderLessons('animals', 1);
})();

// ===== App lessonsFor 1:1 =====
function lessonsFor(themeId, band) {
  const units = (THEMES[themeId]?.units || []).filter(u => u.band === band);
  const all = units.flatMap(u => u.cards.map(c => ({c, isNew: u.newFirst === true}))).filter(x =>
    band <= 2 ? (!LISTEN_TYPES.includes(x.c.type) && x.c.image) : LISTEN_TYPES.includes(x.c.type));
  const out = [];
  for (let i = 0; i < all.length; i += 10) {
    const list = all.slice(i, i+10);
    out.push({ id:`${themeId}-l${band}-lesson${out.length+1}`, idx:out.length+1, title:list[0].c.en,
      cards:list.map(x=>x.c), cam:list.some(x=>x.isNew) });
  }
  return out;
}

async function runChecks() {
  const items = [];
  const add = (name, pass, detail='') => items.push({name, pass, detail});
  const A = THEMES.animals;
  const nU = A.units.length, nC = A.units.reduce((s,u)=>s+u.cards.length,0);
  add('animals.json 19 单元 / 107 卡', nU===19 && nC===107, `${nU}/${nC}`);
  const l1u3 = A.units.find(u => u.id==='animals-l1-u3');
  add('L1 新单元 newFirst（Fish/Chicken/Bee/Snail/Penguin/Dolphin）', !!l1u3 && l1u3.newFirst===true && l1u3.cards.map(c=>c.en).join()==='Fish,Chicken,Bee,Snail,Penguin,Dolphin');
  const badImg = A.units.flatMap(u=>u.cards).filter(c => c.image && !c.image.startsWith('img/'));
  add('全部卡片 image 带 img/ 前缀', badImg.length===0, badImg.map(c=>c.id).join(','));
  const imgs = [...new Set(Object.values(THEMES).flatMap(t=>t.units.flatMap(u=>u.cards)).map(c=>c.image).filter(Boolean))];
  let imgOk=0; const imgBad=[];
  await Promise.all(imgs.map(async p => { try { const r=await fetch(p,{method:'HEAD'}); r.ok?imgOk++:imgBad.push(p); } catch { imgBad.push(p); } }));
  add(`全主题图片可访问（${imgs.length} 张）`, imgBad.length===0, imgBad.join(','));
  const noAud = Object.entries(vocab).filter(([w,e])=>!e.aud).map(([w])=>w);
  add(`vocab 全词库（${Object.keys(vocab).length} 词）全部带真人配音`, noAud.length===0, noAud.join(','));
  const vaud = [...new Set(Object.values(vocab).map(e=>e.aud))];
  let vOk=0; const vBad=[];
  await Promise.all(vaud.map(async p => { try { const r=await fetch(p,{method:'HEAD'}); r.ok?vOk++:vBad.push(p); } catch { vBad.push(p); } }));
  add(`vocab 音频可访问（${vaud.length} 条）`, vBad.length===0, vBad.join(','));
  const seg400 = index.filter(e=>e.i>=400&&e.i<450).length;
  const seg450 = index.filter(e=>e.i>=450&&e.i<540).length;
  const seg550 = index.filter(e=>e.i>=550&&e.i<612).length;
  const seg612 = index.filter(e=>e.i>=612).length;
  add(`索引分段：400-433=${seg400} / 450-528=${seg450} / 550-611=${seg550} / 612-769=${seg612}`,
      seg400===34 && seg450===79 && seg550>0 && seg612>0,
      `400s=${seg400} 450s=${seg450} 550s=${seg550} 612s=${seg612}`);

  // ===== ⑥ 6 个新主题扩充检查 =====
  const new6Cards = NEW6.flatMap(t=>THEMES[t].units.flatMap(u=>u.cards));
  const n6w = new6Cards.length;
  add('6 新主题 JSON 齐全（clothes/home/school/toys/transport/beach）',
      NEW6.every(t=>THEMES[t] && THEMES[t].units.length>0),
      NEW6.map(t=>`${t}:${THEMES[t]?THEMES[t].units.length:0}单元`).join(' '));
  add(`6 新主题共 ${n6w} 词卡（12+12+12+8+10+8=62）`, n6w===62, String(n6w));
  const noImg = new6Cards.filter(c=>!c.image || !c.image.startsWith('img/')).map(c=>c.id);
  const noZh  = new6Cards.filter(c=>!c.zh).map(c=>c.id);
  const noAud6= new6Cards.filter(c=>!c.audio || !c.audio.startsWith('audio/all/')).map(c=>c.id);
  add('新主题 62 卡：图带 img/ 前缀 + 中文释义 + 真人音频路径齐全',
      noImg.length===0 && noZh.length===0 && noAud6.length===0,
      [noImg.join(','),noZh.join(','),noAud6.join(',')].filter(Boolean).join(' | '));
  const n6imgs = [...new Set(new6Cards.map(c=>c.image))];
  let i6ok=0; const i6bad=[];
  await Promise.all(n6imgs.map(async p => { try { const r=await fetch(p,{method:'HEAD'}); r.ok?i6ok++:i6bad.push(p); } catch { i6bad.push(p); } }));
  add(`新主题 62 张图片可访问（cam-剑桥原图31 + ai-生成31）`, i6bad.length===0 && n6imgs.length===62, i6bad.join(','));
  const n6auds = [...new Set(new6Cards.map(c=>c.audio))];
  let a6ok=0; const a6bad=[];
  await Promise.all(n6auds.map(async p => { try { const r=await fetch(p,{method:'HEAD'}); r.ok?a6ok++:a6bad.push(p); } catch { a6bad.push(p); } }));
  add(`新主题 62 条音频可访问（Aria 550-611）`, a6bad.length===0 && n6auds.length===62, a6bad.join(','));
  const n6words = new6Cards.map(c=>c.en.toLowerCase());
  const notInVocab = n6words.filter(w=>!vocab[w]);
  add('新主题 62 词全部收录点词查义词库', notInVocab.length===0, notInVocab.join(','));
  const noLesson = NEW6.filter(t=>lessonsFor(t,1).length < 1);
  const lessonDetail = NEW6.map(t=>`${t}:${lessonsFor(t,1).length}课`).join(' ');
  add('★ 每个新主题至少 1 节课（L1 档）', noLesson.length===0, lessonDetail);
  const n6l1 = NEW6.map(t=>lessonsFor(t,1)).flat();
  const n6cam = n6l1.filter(l=>l.cam).length;
  add('新主题 L1 课程均带 🎓剑桥徽章', n6cam===n6l1.length, `徽章课 ${n6cam}/${n6l1.length}`);
  const n6TotalCards = NEW6.reduce((s,t)=>s+lessonsFor(t,1).reduce((x,l)=>x+l.cards.length,0),0);
  add('新主题 L1 课卡总数 = 62（无遗漏无重复）', n6TotalCards===62 && new Set(n6l1.flatMap(l=>l.cards.map(c=>c.id))).size===62,
      `课卡 ${n6TotalCards} / 去重 ${new Set(n6l1.flatMap(l=>l.cards.map(c=>c.id))).size}`);

  // ===== ⑧ Starters 全量补齐（v5 新增）=====
  const s3 = NEW3.map(t=>({t, lessons: lessonsFor(t,1), cards: NEW3.length? THEMES[t].units.flatMap(u=>u.cards):[]}));
  const s3total = s3.reduce((n,x)=>n+x.cards.length,0);
  add(`Starters 新主题 family/rooms/sports 共 ${s3total} 张词卡`, s3.every(x=>x.cards.length>0) && s3total>=45,
      s3.map(x=>`${x.t}:${x.cards.length}卡/${x.lessons.length}课`).join(' '));
  const s3noimg = s3.flatMap(x=>x.cards).filter(c=>!c.image || !c.image.startsWith('img/'));
  const s3noaud = s3.flatMap(x=>x.cards).filter(c=>!c.audio || !c.audio.startsWith('audio/all/'));
  add('新主题词卡图/音引用规范', s3noimg.length===0 && s3noaud.length===0,
      `缺图${s3noimg.length} 缺音${s3noaud.length}`);
  const s3imgs = [...new Set(s3.flatMap(x=>x.cards).map(c=>c.image))];
  let s3ok=0; const s3bad=[];
  await Promise.all(s3imgs.map(async p=>{ try{ const r=await fetch(p,{method:'HEAD'}); r.ok?s3ok++:s3bad.push(p);}catch{s3bad.push(p);} }));
  add(`新主题图片可访问（${s3imgs.length} 张）`, s3bad.length===0, s3bad.slice(0,5).join(','));
  const s3auds = [...new Set(s3.flatMap(x=>x.cards).map(c=>c.audio))];
  let s3aok=0; const s3abad=[];
  await Promise.all(s3auds.map(async p=>{ try{ const r=await fetch(p,{method:'HEAD'}); r.ok?s3aok++:s3abad.push(p);}catch{s3abad.push(p);} }));
  add(`新主题音频可访问（${s3auds.length} 条）`, s3abad.length===0, s3abad.slice(0,5).join(','));
  add(`词库规模（${Object.keys(vocab).length} 词，Starters/Movers/Flyers 三级官方词表全覆盖）`, Object.keys(vocab).length>=1400, String(Object.keys(vocab).length));

  // ===== ⑨ Movers / Flyers 三级检查（v6 新增）=====
  const mvCards = MV8.flatMap(t=>THEMES[t].units.flatMap(u=>u.cards));
  const flCards = FL8.flatMap(t=>THEMES[t].units.flatMap(u=>u.cards));
  add(`Movers 8 主题共 ${mvCards.length} 卡（每主题至少 1 课）`, MV8.every(t=>lessonsFor(t,1).length>=1), MV8.map(t=>`${t}:${THEMES[t].units.reduce((s,u)=>s+u.cards.length,0)}`).join(' '));
  add(`Flyers 8 主题共 ${flCards.length} 卡（每主题至少 1 课）`, FL8.every(t=>lessonsFor(t,1).length>=1), FL8.map(t=>`${t}:${THEMES[t].units.reduce((s,u)=>s+u.cards.length,0)}`).join(' '));
  const bothNoImg = [...mvCards, ...flCards].filter(c=>!c.image||!c.image.startsWith('img/'));
  const bothNoAud = [...mvCards, ...flCards].filter(c=>!c.audio||!c.audio.startsWith('audio/all/'));
  const bothNoZh = [...mvCards, ...flCards].filter(c=>!c.zh);
  add('Movers/Flyers 全部词卡图/音/释义齐全', bothNoImg.length===0&&bothNoAud.length===0&&bothNoZh.length===0,
      `缺图${bothNoImg.length} 缺音${bothNoAud.length} 缺义${bothNoZh.length}`);
  const mfimgs = [...new Set([...mvCards,...flCards].map(c=>c.image))];
  let mfok=0; const mfbad=[];
  await Promise.all(mfimgs.map(async p=>{ try{const r=await fetch(p,{method:'HEAD'}); r.ok?mfok++:mfbad.push(p);}catch{mfbad.push(p);} }));
  add(`Movers/Flyers 图可访问（${mfimgs.length} 张）`, mfbad.length===0, mfbad.slice(0,5).join(','));
  const mfauds = [...new Set([...mvCards,...flCards].map(c=>c.audio))];
  let mfaok=0; const mfabad=[];
  await Promise.all(mfauds.map(async p=>{ try{const r=await fetch(p,{method:'HEAD'}); r.ok?mfaok++:mfabad.push(p);}catch{mfabad.push(p);} }));
  add(`Movers/Flyers 音可访问（${mfauds.length} 条）`, mfabad.length===0, mfabad.slice(0,5).join(','));
  const mfw = [...mvCards,...flCards].map(c=>c.en.toLowerCase().split(' (')[0].replace(' fire engine',' fire_engine'));
  const mfwMiss = mfw.filter(w=>!vocab[w]);
  add('Movers/Flyers 词卡词全部收录词库（点词查义可用）', mfwMiss.length===0, [...new Set(mfwMiss)].slice(0,8).join(','));
  const azCt = Object.keys(vocab).length;
  add(`词库含三级官方词表（Starters 476 / Movers 453 / Flyers 564）`, azCt>=1419, String(azCt));

  // ===== ⑦ 点词查义全覆盖（v4 新增） =====
  const ck = s => s.toLowerCase().replace(/^[ .,!?;:()"'–’]+|[ .,!?;:()"'–’]+$/g, '');
  const clickable = new Set();
  Object.keys(THEMES).forEach(t => THEMES[t].units.forEach(u => u.cards.forEach(c => {
    if (LISTEN_TYPES.includes(c.type)) c.en.split(' ').forEach(w => { const k = ck(w); if (k) clickable.add(k); });
  })));
  const clickArr = [...clickable];
  const noEntryAll = clickArr.filter(w => !vocab[w]);
  add(`句类卡可点击词 ${clickArr.length} 个 100% 收录词库`, noEntryAll.length===0, noEntryAll.slice(0,10).join(','));
  const noAudAll = clickArr.filter(w => vocab[w] && !vocab[w].aud);
  add('全部可点击词带真人配音（不依赖系统 TTS，无静音风险）', noAudAll.length===0, noAudAll.slice(0,10).join(','));
  let cOk=0; const cBad=[];
  await Promise.all(clickArr.filter(w=>vocab[w]&&vocab[w].aud).map(async w => {
    try { const r = await fetch(vocab[w].aud, {method:'HEAD'}); r.ok?cOk++:cBad.push(w); } catch { cBad.push(w); }
  }));
  add(`可点击词音频文件全部可访问（${cOk} 条）`, cBad.length===0, cBad.slice(0,5).join(','));
  // 词卡单词也须收录
  const wcards = Object.keys(THEMES).flatMap(t=>THEMES[t].units.flatMap(u=>u.cards)).filter(c=>c.type==='word').map(c=>ck(c.en));
  const wmiss = wcards.filter(w=>!vocab[w]);
  add('全部词卡单词收录词库', wmiss.length===0, [...new Set(wmiss)].join(','));
  // 弹卡自动播放：真实点击一个词，监听 Audio 构造
  let autoPlays = 0;
  const OrigAudio = window.Audio;
  window.Audio = function(src){ autoPlays++; return new OrigAudio(src); };
  const sampleWord = document.querySelector('#sentences .chip');
  if (sampleWord) sampleWord.click();
  const popBtnTxt = document.querySelector('#popup button')?.textContent || '';
  window.Audio = OrigAudio;
  document.getElementById('popup').style.display = 'none';
  add('点词弹卡自动播放一次（无需手点）', autoPlays >= 1, `Audio 调用 ${autoPlays} 次`);
  add('发音按钮只有一个 🔊 图标', (popBtnTxt.match(/🔊/g)||[]).length === 1, JSON.stringify(popBtnTxt));
  // 二次点击可重播
  let replay = 0;
  window.Audio = function(src){ replay++; return new OrigAudio(src); };
  playPop(); playPop();
  window.Audio = OrigAudio;
  add('发音按钮可重复点击重播', replay >= 2, `重播 ${replay} 次`);

  // ===== 课程树检查（独立统计自洽校验，不硬编码预期） =====
  let treeOK = true, treeDetail = '';
  const expectOf = (t, b) => {
    // 独立统计：不经 lessonsFor，直接数各主题档位的可课卡
    const cnt = (THEMES[t].units.filter(u=>u.band===b).flatMap(u=>u.cards)).filter(c =>
      b<=2 ? (!LISTEN_TYPES.includes(c.type) && c.image && c.image.startsWith('img/')) : LISTEN_TYPES.includes(c.type)).length;
    const exp = []; for (let i=0;i<cnt;i+=10) exp.push(Math.min(10, cnt-i)); return exp;
  };
  for (const t of Object.keys(THEMES)) {
    for (let b = 1; b <= 6; b++) {
      const exp = expectOf(t, b);
      const got = lessonsFor(t, b).map(l => l.cards.length);
      if (JSON.stringify(got) !== JSON.stringify(exp) || got.some(n=>n>10)) {
        treeOK = false; treeDetail += `${t}-L${b}:${got}≠${exp} `;
      }
    }
  }
  const totalLessons = Object.keys(THEMES).reduce((s,t)=>{ for(let b=1;b<=6;b++) s+=lessonsFor(t,b).length; return s; }, 0);
  add(`课程树划分自洽（${Object.keys(THEMES).length}主题×6档位 = ${totalLessons} 课，每课≤10）`, treeOK, treeDetail || 'lessonsFor 分组与独立统计一致');
  const camLessons = lessonsFor('animals', 2).filter(l => l.cam);
  const camCards = [...new Set(camLessons.flatMap(l=>l.cards.map(c=>c.id)))].filter(id=>/l2-u[4-7]/.test(id));
  const allCamNew = THEMES.animals.units.filter(u=>u.newFirst).flatMap(u=>u.cards).filter(c=>/l2-u[4-7]/.test(c.id));
  add('animals L2 🎓剑桥徽章课覆盖 u4-u7 全部 25 新卡', camCards.length === allCamNew.length,
      `徽章课第${camLessons.map(l=>l.idx).join(',')}课 覆盖 ${camCards.length}/${allCamNew.length} 新卡`);
  const l1Cam = lessonsFor('animals', 1).filter(l=>l.cam);
  add('animals L1 含 🎓剑桥课（Sea friends 6 新词）', l1Cam.length >= 1, `L1 徽章课: 第${l1Cam.map(l=>l.idx).join(',')}课`);

  // ===== 两轮制状态机模拟 =====
  const simResults = simulateAllLessons();
  add(`两轮制状态机模拟 ${simResults.total} 课全通过（图轮选对叠词→乱序词轮选对图显词下）`,
      simResults.fails.length===0, simResults.fails.slice(0,5).join(';') || `覆盖${Object.keys(THEMES).length}主题全部课`);
  const shuffleOK = simulateShuffle();
  add('词轮乱序性 ×20（与图轮顺序不同、元素相同）', shuffleOK.ok, shuffleOK.detail);
  const rand = simulateRandom(20);
  add('随机课模拟 ×20（每次10卡⊆全集、选项含正确项）', rand.ok, rand.detail);

  const fails = items.filter(i => !i.pass);
  document.getElementById('verdict').innerHTML = fails.length===0
    ? `<span class="ok">✅ 全部 ${items.length} 项通过</span>` : `<span class="bad">❌ ${fails.length}/${items.length} 项未过</span>`;
  document.getElementById('p1').innerHTML =
    '<table><tr><th>检查项</th><th>结果</th><th>详情</th></tr>' +
    items.map(i=>`<tr><td>${i.name}</td><td class="${i.pass?'ok':'bad'}">${i.pass?'✓':'✗'}</td><td>${i.detail||''}</td></tr>`).join('') + '</table>';
}

// ===== 双步状态机：模拟 App 全部课程 =====
function simulateAllLessons() {
  const fails = []; let total = 0;
  for (const t of Object.keys(THEMES)) {
    for (let b = 1; b <= 6; b++) {
      for (const l of lessonsFor(t, b)) {
        total++;
        const res = simulateWalk(l, t, b);
        if (!res.ok) fails.push(`${l.id}: ${res.msg}`);
      }
    }
  }
  return { total, fails };
}

function simulateWalk(lesson, themeId, band) {
  let stars = 0;
  const wordPool = (THEMES[themeId].units.filter(u=>u.band===band).flatMap(u=>u.cards)).filter(c=>c.type==='word'||c.type==='phrase').map(c=>c.en);
  const cards = lesson.cards;
  // ===== 第1遍 图轮 =====
  if (band <= 2) {
    for (const c of cards) {
      if (!(c.image && c.image.startsWith('img/'))) return {ok:false, msg:`${c.id} 图轮无图`};
      stars++;   // 选对 → 词叠加图上 → 继续
    }
    // ===== 第2遍 词轮（乱序） =====
    const round2 = [...cards].sort(()=>Math.random()-.5);
    // 乱序必须覆盖同一批卡
    if (new Set(round2.map(c=>c.id)).size !== new Set(cards.map(c=>c.id)).size)
      return {ok:false, msg:'词轮卡片集不一致'};
    for (const c of round2) {
      const want = band<=1?2:4;
      const others = wordPool.filter(w=>w!==c.en).slice(0, want-1);
      const opts = [c.en, ...others];
      if (!opts.includes(c.en) || opts.length < 2) return {ok:false, msg:`${c.id} 词轮选项构建失败`};
      if (!(c.image && c.en)) return {ok:false, msg:`${c.id} 词轮揭示缺素材（图/词）`};
      stars++;
    }
  } else {
    // 句课一轮
    for (const c of cards) {
      if (!LISTEN_TYPES.includes(c.type)) return {ok:false, msg:`${c.id} band>=3 但非句卡`};
      stars++;
    }
  }
  return {ok:true, stars};
}

function simulateShuffle() {
  for (let i = 0; i < 20; i++) {
    const ls = lessonsFor('animals', 2);
    const l = ls[i % ls.length];
    if (l.cards.length < 4) continue;
    const round2 = [...l.cards].sort(()=>Math.random()-.5);
    if (JSON.stringify(round2.map(c=>c.id)) === JSON.stringify(l.cards.map(c=>c.id))) continue; // 偶尔全同可接受，重试
    const same = new Set([...round2, ...l.cards].map(c=>c.id)).size;
    if (same !== l.cards.length) return {ok:false, detail:'乱序后元素变了'};
    if (JSON.stringify(round2.map(c=>c.id)) === JSON.stringify(l.cards.map(c=>c.id)) && l.cards.length > 2)
      return {ok:false, detail:20-i+': 未乱序'};
    return {ok:true, detail:'乱序且元素一致 ✓'};
  }
  return {ok:true, detail:'抽样通过'};
}

function simulateRandom(times) {
  const all = lessonsFor('animals', 2).flatMap(l=>l.cards);
  const ids = new Set(all.map(c=>c.id));
  for (let i = 0; i < times; i++) {
    const picks = [...all].sort(()=>Math.random()-.5).slice(0,10);
    if (picks.length !== 10) return {ok:false, detail:'随机不足10'};
    if (!picks.every(p=>ids.has(p.id))) return {ok:false, detail:'随机含非全集卡'};
  }
  return {ok:true, detail:'每次恰 10 卡且全部来自该档位全集'};
}

// ===== ② 课程树 UI =====
let curT = 'animals', curB = 1;
const passedSet = () => new Set(JSON.parse(localStorage.getItem(LS) || '[]'));
function pickT(key, btn) {
  const [t, b] = key.includes('-l') ? key.split('-l') : [key, 1];
  curT = t; curB = parseInt(b);
  document.querySelectorAll('.btn[data-t]').forEach(x => x.classList.remove('sel'));
  btn.classList.add('sel');
  renderLessons(curT, curB);
}
function renderLessons(t, b) {
  const ls = lessonsFor(t, b);
  const passed = passedSet();
  const totalCards = ls.reduce((s,l)=>s+l.cards.length, 0);
  document.getElementById('lessons').innerHTML =
    `<div class="panel"><b>${t} · L${b}</b> <span class="muted">共 ${ls.length} 课 / ${totalCards} 个内容</span>
     <div class="lesson all" onclick="simRandom()"><span style="font-size:26px">🎲</span>
       <span class="l-title"><b>随机学习</b><div>从 ${totalCards} 个内容随机抽 10 个</div></span>
       <span class="l-progress" style="color:var(--greend)">GO</span></div>` +
    ls.map(l => {
      const done = l.cards.filter(c=>passed.has(c.id)).length;
      const all = done >= l.cards.length;
      return `<div class="lesson" onclick="simOpen('${t}',${b},${l.idx-1})"><span style="font-size:26px">📖</span>
        <span class="l-title"><b>第 ${l.idx} 课</b>${l.cam?' <span style="font-size:11px;background:#FFE0B2;color:#E65100;border-radius:8px;padding:2px 8px">🎓剑桥</span>':''}<div>${l.title} … 共 ${l.cards.length} 个</div></span>
        <span class="l-progress" style="color:${all?'var(--greend)':'var(--hint)'}">${done}/${l.cards.length} ${all?'✓':'›'}</span></div>`;
    }).join('') + '</div>';
}
function resetProgress() { localStorage.removeItem(LS); renderLessons(curT, curB); }

// ===== ③ 两轮制学习模拟器（第1遍图轮选对叠词 → 第2遍词轮乱序选对图显词下） =====
let sim = null;
function simOpen(t, b, li) {
  const lesson = lessonsFor(t, b)[li];
  const isListen = b >= 3;
  // 词课：round2 = 乱序；句课：一轮
  sim = { lesson, i:0, stars:0, t, b, round: 0,
          round2: (!isListen && lesson.cards[0] && !LISTEN_TYPES.includes(lesson.cards[0].type)) ? [...lesson.cards].sort(()=>Math.random()-.5) : null,
          queue: lesson.cards };
  renderStep();
}
function simRandom() {
  const all = lessonsFor(curT, curB).flatMap(l=>l.cards);
  const cards = [...all].sort(()=>Math.random()-.5).slice(0,10);
  sim = { lesson:{id:'random', idx:0, title:'随机课', cards}, i:0, stars:0, t:curT, b:curB, round:0,
          round2: (curB<=2 && cards[0] && !LISTEN_TYPES.includes(cards[0].type)) ? [...cards].sort(()=>Math.random()-.5) : null,
          queue: cards };
  renderStep();
}
function simPick(band) { simOpen('animals', band, 0); }
function curCard() { return sim.queue[sim.i]; }
function roundTotal() { return sim.queue.length; }

function imgOpts(c) {
  const pool = [...new Set(THEMES[sim.t].units.filter(u=>u.band===sim.b).flatMap(u=>u.cards).map(x=>x.image).filter(Boolean))];
  const want = sim.b<=1?2:4;
  const dis = pool.filter(p=>p!==c.image).sort(()=>Math.random()-.5).slice(0,want-1);
  return [c.image, ...dis].sort(()=>Math.random()-.5);
}
function wordOpts(c) {
  const pool = THEMES[sim.t].units.filter(u=>u.band===sim.b).flatMap(u=>u.cards).filter(x=>x.type==='word'||x.type==='phrase').map(x=>x.en);
  const want = sim.b<=1?2:4;
  const dis = pool.filter(w=>w!==c.en).sort(()=>Math.random()-.5).slice(0,want-1);
  return [c.en, ...dis].sort(()=>Math.random()-.5);
}

function renderStep() {
  const box = document.getElementById('sim');
  const stat = document.getElementById('simStat');
  if (!sim) { box.innerHTML = '<span class="muted">先点上方按钮选一课</span>'; return; }
  if (sim.i >= roundTotal()) {
    // 本轮结束
    if (sim.round === 0 && sim.round2) {
      // 图轮完 → 词轮（乱序）
      sim.round = 1; sim.queue = sim.round2; sim.i = 0;
      stat.innerHTML = '<b class="ok">🔄 第1遍完成 → 进入第2遍（乱序）</b>';
    } else {
      box.innerHTML = `<div style="font-size:36px">🎉</div><b style="font-size:20px">这课学完啦！</b>
        <div class="stat">⭐ ${sim.stars} 星 · 两轮 ${sim.lesson.cards.length} 个内容 ${sim.round2?'（图轮+乱序词轮）':'（句子一轮）'}</div>`;
      stat.textContent = '';
      if (!sim.lesson.id.includes('random')) {
        const s = passedSet(); sim.lesson.cards.forEach(c=>s.add(c.id));
        localStorage.setItem(LS, JSON.stringify([...s]));
      }
      renderLessons(curT===sim.t?curT:sim.t, curT===sim.t?curB:sim.b);
      return;
    }
  }
  const c = curCard();
  const head = `<div class="muted">(${sim.i+1}/${roundTotal()}) 第${sim.lesson.idx}课${sim.round2?(sim.round===0?' · 🎧第1遍·看图':' · 🔤第2遍·认词'):''} · ${c.zh||''} · ⭐${sim.stars}</div>`;
  if (LISTEN_TYPES.includes(c.type)) {
    box.innerHTML = head + `<div class="chip" style="font-size:22px" onclick="simNext()">${c.en}</div>
      <div class="muted">${c.zh||''}</div><button class="btn" onclick="simNext()">下一句 →</button>`;
    stat.textContent = 'L3+ 句子卡：听+跟读（App 内逐词可点+跟读）';
    return;
  }
  if (sim.round === 0) {
    // ===== 第1遍：全是图，选对 → 英文单词叠在图上 =====
    const opts = imgOpts(c);
    box.innerHTML = head + `<b>🎧 第1遍 · 听一听，选出图片</b><br>` +
      opts.map(o=>`<span class="opt-img" data-o="${o}" onclick="simPickImg(this,'${o}')"><img src="${o}"><span class="img-word" style="display:none;font-size:22px;font-weight:900;color:#4E342E;background:rgba(255,255,255,.92);border-radius:10px;padding:2px 12px">${c.en}</span></span>`).join('');
    stat.textContent = '第1遍/图轮：10张图随机出，选对→单词叠加图上（本轮共'+roundTotal()+'题，完了进第2遍）';
  } else {
    // ===== 第2遍：先是单词按钮，选对 → 图片显示在文字下面 =====
    const opts = wordOpts(c);
    box.innerHTML = head + `<b>🔤 第2遍 · 再听一次，选出单词（乱序）</b><br>` +
      opts.map((o,i)=>`<span class="opt-word" style="background:${['#FF9E80','#80DEEA','#B39DDB','#AED581'][i%4]}" onclick="simPickWord(this,'${o.replace(/'/g,"\\'")}')">${o}</span>`).join('') +
      `<div class="img-slot" style="margin-top:10px;display:none;background:#fff;border-radius:18px;padding:8px"><img style="width:160px;height:160px;object-fit:contain"><div class="zh" style="color:#A1887F;font-size:14px"></div></div>`;
    stat.textContent = '第2遍/词轮：乱序出现，选对→图片显示在文字下面';
  }
}

// 图轮选卡
function simPickImg(el, o) {
  const c = curCard();
  if (o === c.image) {
    sim.stars++; sim.ok = true;
    el.querySelector('.img-word').style.display = 'inline-block';
    el.style.outline = '4px solid #5BBFA0';
    const hit = index.find(e=>e.en.toLowerCase()===c.en.toLowerCase());
    if (hit) new Audio('audio/all/'+hit.file).play().catch(()=>{});
    simStat.innerHTML = '<span class="ok">✓ 图选对：单词「'+c.en+'」已叠加在图上 +1⭐ → 点继续</span>';
    showContinue();
  } else {
    el.style.outline = '4px solid #C62828';
    simStat.innerHTML = '<span class="bad">✗ 答错：不推进，重听</span>';
  }
}
// 词轮选词
function simPickWord(el, o) {
  const c = curCard();
  if (o === c.en) {
    sim.stars++;
    const slot = document.querySelector('.img-slot');
    if (slot) {
      slot.style.display = 'inline-block';
      slot.querySelector('img').src = c.image;
      slot.querySelector('.zh').textContent = c.zh || '';
    }
    el.style.outline = '4px solid #5BBFA0';
    const hit = index.find(e=>e.en.toLowerCase()===c.en.toLowerCase());
    if (hit) new Audio('audio/all/'+hit.file).play().catch(()=>{});
    simStat.innerHTML = '<span class="ok">✓ 词选对：图片已显示在文字下面 +1⭐ → 点继续</span>';
    showContinue();
  } else {
    el.style.filter = 'grayscale(1)';
    simStat.innerHTML = '<span class="bad">✗ 答错：不推进，重听</span>';
  }
}
function showContinue() {
  // 在盒子尾部插入继续按钮（选对后才出现，同 App）
  let btn = document.getElementById('simContinue');
  if (btn) btn.remove();
  btn = document.createElement('button');
  btn.id = 'simContinue'; btn.className = 'btn'; btn.textContent = '继续 🐣';
  btn.style.display = 'block'; btn.style.margin = '10px auto';
  btn.onclick = () => { btn.remove(); simNext(); };
  document.getElementById('sim').appendChild(btn);
}
function simNext() { sim.i++; sim.ok = false; renderStep(); }

function simAuto() {
  if (!sim) simOpen('animals', 1, 0);
  let guard = 0;
  const tick = setInterval(() => {
    const btn = document.getElementById('simContinue');
    if (btn) { btn.click(); return; }        // 有继续按钮先点它
    if (sim.i >= roundTotal()) {
      // 轮结束：renderStep 已自动衔接（图轮完→词轮；词轮完→完成页）
      renderStep();
      if (guard++ > 400) clearInterval(tick);
      return;
    }
    const c = curCard();
    if (LISTEN_TYPES.includes(c.type)) { simNext(); return; }
    if (sim.round === 0) {
      const el = [...document.querySelectorAll('.opt-img')].find(x => x.dataset.o === c.image);
      if (el) simPickImg(el, c.image);
    } else {
      const el = [...document.querySelectorAll('.opt-word')].find(x => x.textContent === c.en);
      if (el) simPickWord(el, c.en);
    }
    if (guard++ > 400) clearInterval(tick);
  }, 100);
}

// ===== ⑤ 点词查义 =====
function renderSentences() {
  const s = THEMES.animals.units.find(u => u.id === 'animals-l3-u2');
  document.getElementById('sentences').innerHTML = s.cards.map(c => {
    const chips = c.en.split(' ').map(w =>
      `<span class="chip" onclick="tapWord('${w.replace(/'/g,"\\'")}')">${w}</span>`).join(' ');
    return `<div class="panel"><div class="muted">${c.zh}</div>${chips}</div>`;
  }).join('');
}
let popCtx = null;
function tapWord(display) {
  const key = display.toLowerCase().replace(/^[ .,!?;:()"'–’]+|[ .,!?;:()"'–’]+$/g, '');
  const e = vocab[key];
  document.getElementById('popWord').textContent = display;
  document.getElementById('popZh').textContent = e ? (e.zh || '（无释义）') : '❌ 词库无此词';
  document.getElementById('popPos').textContent = e && e.pos ? `词性：${e.pos}` : '';
  const im = document.getElementById('popImg');
  if (e && e.img) { im.src = e.img; im.style.display = ''; } else im.style.display = 'none';
  document.getElementById('popup').style.display = 'flex';
  if (window.event) window.event.stopPropagation();
  popCtx = { display, e };
  playPop();   // 弹卡即自动读一遍（与 App 一致）；可再点按钮重复听
}
function playPop() {
  if (!popCtx) return;
  const e = popCtx.e;
  if (e && e.aud) { const a = new Audio(e.aud); a.play().catch(()=>{}); }
}
