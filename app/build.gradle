// 读 local.properties 中的讯飞密钥 → BuildConfig（密钥不进代码库）
def localProps = new Properties()
def lpFile = rootProject.file('local.properties')
if (lpFile.exists()) localProps.load(new FileInputStream(lpFile))

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 30
    buildToolsVersion '30.0.3'

    defaultConfig {
        applicationId 'com.family.listenspeak'
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 10
        versionName '0.2.8'
        // 讯飞评测三件套从 local.properties 注入；缺失时为空（App 内提示补填）
        buildConfigField 'String', 'XF_APP_ID', "\"${localProps.getProperty('xf.appid', '')}\""
        buildConfigField 'String', 'XF_API_KEY', "\"${localProps.getProperty('xf.apikey', '')}\""
        buildConfigField 'String', 'XF_API_SECRET', "\"${localProps.getProperty('xf.apisecret', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }

    // APK 产物命名：稳稳学英语.apk（不再用默认 app-debug.apk）
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "稳稳学英语.apk"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    // UI
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    // 数据
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.room:room-ktx:2.3.0'
    kapt 'androidx.room:room-compiler:2.3.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    // 评测 WebSocket（JDK8/旧链友好版本）
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // 测试
    testImplementation 'junit:junit:4.13.2'
}
